[project]
name = "heimdall"
version = "0.1.0"
requires-python = ">=3.14"
# core: what every part needs (c3dir constants / geometry / dataset, NetCDF files)
dependencies = [
    "netcdf4>=1.7.4",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyproj>=3.8.0",
    "scipy>=1.18.1",
    "xarray>=2026.9.0",
]

[project.optional-dependencies]
# download and collocate EarthCARE / GOES-19 (earthcarekit and goes2go also pull in matplotlib)
scrape = [
    "earthcarekit>=0.19.0",
    "goes2go>=2025.10.0",
    "requests>=2.34.2",
]
# train, evaluate and run the C3DIR model
ml = [
    "torch>=2.14.1",
]
# figures (maps need cartopy)
plots = [
    "cartopy>=0.26.0",
    "matplotlib>=3.11.2",
]
# solar forecasting: SURFRAD data and clear-sky modeling
solar = [
    "pvlib>=0.16.1",
    "requests>=2.34.2",
]

[dependency-groups]
# local development installs everything
dev = [
    "heimdall[scrape,ml,plots,solar]",
]

[build-system]
requires = ["uv_build>=0.8"]
build-backend = "uv_build"
