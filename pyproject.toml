[project]
name = "heimdall"
version = "0.1.0"
requires-python = ">=3.14, <3.15"
dependencies = [
    "geopandas",
    "imageio",
    "ipykernel",
    "ipywidgets",
    "matplotlib",
    "netcdf4",
    "numpy",
    "pandas",
    "scikit-learn",
    "torch",
    "torchmetrics",
    "tqdm",
    "xarray",
    "xbatcher",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
