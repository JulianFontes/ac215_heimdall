[project]
name = "model-deploy"
version = "0.1.0"
description = "Forecasts from trained nowcasting checkpoints"
requires-python = ">=3.14, <3.15"
dependencies = [
    "model-core",
    "geopandas",
    "pandas",
    "shapely",
]

[tool.uv.sources]
model-core = { path = "../model-core", editable = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

# Namespace packages shared with model-core (see its pyproject.toml).
[tool.uv.build-backend]
module-root = ""
module-name = ["c3dir_nowcasting", "goes_nowcasting"]
namespace = true
