[project]
name = "model-deploy"
version = "0.1.0"
description = "C3DIR predictions on live GOES-19 scans, and forecasts from trained nowcasting checkpoints"
requires-python = ">=3.14, <3.15"
dependencies = [
    "heimdall-core[plots]",
    "model-core",
    "geopandas",
    "goes2go",
    "h5py",  # xarray reads the GOES scans through h5netcdf
    "matplotlib",
    "pandas",
    "shapely",
]

[tool.uv.sources]
heimdall-core = { path = "../heimdall-core", editable = true }
model-core = { path = "../model-core", editable = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

# Namespace packages shared with model-core (see its pyproject.toml).
[tool.uv.build-backend]
module-root = ""
module-name = ["c3dir", "c3dir_forecasting", "c3dir_nowcasting", "goes_nowcasting"]
namespace = true
