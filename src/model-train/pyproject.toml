[project]
name = "model-train"
version = "0.1.0"
description = "Training and evaluation of C3DIR and the nowcasting models"
requires-python = ">=3.14, <3.15"
dependencies = [
    "heimdall-core[plots,gcs]",
    "model-core",
    "cartopy",
    "imageio-ffmpeg",
    "ipykernel",
    "ipywidgets",
    "matplotlib",
    "pandas",
    "scikit-learn",
    "scipy",
    "torchmetrics",
    "tqdm",
    "xbatcher",
]

[tool.uv.sources]
heimdall-core = { path = "../heimdall-core", editable = true }
model-core = { path = "../model-core", editable = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

# Namespace packages shared with model-core (see its pyproject.toml).
[tool.uv.build-backend]
module-root = ""
module-name = ["c3dir", "c3dir_nowcasting", "goes_nowcasting"]
namespace = true
