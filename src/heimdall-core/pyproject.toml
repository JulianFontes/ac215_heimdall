[project]
name = "heimdall-core"
version = "0.1.0"
description = "Light shared code (no torch): C3DIR constants, GOES-19 line-of-sight geometry, data folders, figure style"
requires-python = ">=3.14, <3.15"
dependencies = [
    "numpy",
    "pyproj",  # c3dir.geometry
]

[project.optional-dependencies]
plots = [
    "matplotlib",  # c3dir.plot_style
]
gcs = [
    "google-cloud-storage",  # c3dir.bucket, the shared bucket
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

# Namespace package (no __init__.py): model-core, model-train, model-deploy and data-processing add
# their own modules to c3dir, e.g. c3dir.model next to c3dir.geometry from here.
[tool.uv.build-backend]
module-root = ""
module-name = ["c3dir"]
namespace = true
